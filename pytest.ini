[pytest]
; [ENGINEERING] 只从 tests/ 目录收集测试用例。
;
; 背景：benchmark/skillflow_adapter/downloader.py 下载真实 SkillFlow-Task
; 数据集后，会在 benchmark/cache/SkillFlow-Task/test_tasks/<family>/<task>/tests/
; 下落地官方任务自带的验证脚本（文件名恰好也是 test_output.py / test_outputs.py），
; pytest 默认从 rootdir 递归收集所有 test_*.py，会把这些官方验证脚本误当作
; 本项目的单元测试收集，导致 `pytest -q`（不加路径参数时）报大量收集错误。
;
; 这些脚本是真实 SkillFlow 任务在 subprocess/容器工作区里执行的验证逻辑
; （由 executor/skillflow_executor.py 调用，不是 pytest 单元测试），
; 收窄 testpaths 到 tests/ 只是限定"pytest 默认往哪找测试"，不改变任何
; 单元测试内容/断言，也不影响真实 SkillFlow 验证脚本本身的执行方式。
testpaths = tests
