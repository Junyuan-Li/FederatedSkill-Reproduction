setting_name: "Subset_Setting1_v3_Self_Evolution"
description: |
  Small-scale protocol-consistent Setting1 Self-Evolution reproduction.
  The subset keeps two complete SkillFlow families with official task order.
federated: false

rounds: 8
seed: 42
max_retry: 0
sampler: "family_curriculum"
loop_over_families: true
rounds_per_family_mode: "family_length"
paper_benchmark_only: true
family_subset:
  - "Cross-Format-Data-Reconciliation"
  - "PPT-Formatting-Optimization"
output_dir: "results/subset_setting1_v3"

patcher:
  temperature: 0.2

workers:
  - client_id: "u0"
    backbone_model: "qwen3.6-plus"
    agent_harness: "claude-code"
    model_provider: "dashscope"
    api_base: "https://dashscope.aliyuncs.com/apps/anthropic"
    api_key_env: "QWEN_DASHSCOPE_API_KEY"
    max_context_tokens: 131072
    is_moonshot: false