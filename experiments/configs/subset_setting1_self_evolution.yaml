setting_name: "Subset_Setting1_Self_Evolution"
description: |
  Representative subset controlled baseline: three homogeneous Qwen3.6-plus
  clients evolve independently. No server or cross-client information sharing.
federated: false

rounds: 8
seed: 42
max_retry: 0
sampler: "family_curriculum"
loop_over_families: true
rounds_per_family_mode: "family_length"
paper_benchmark_only: true
family_subset:
  - "Cross-Format-Data-Reconciliation"
  - "PPT-Formatting-Optimization"
  - "Compensation-Scenario-Modeling"
output_dir: "results/subset_setting1_self_evolution"

patcher:
  temperature: 0.2

workers:
  - &qwen_worker
    client_id: "u0"
    backbone_model: "qwen3.6-plus"
    agent_harness: "claude-code"
    model_provider: "dashscope"
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "QWEN_DASHSCOPE_API_KEY"
    max_context_tokens: 131072
    is_moonshot: false
  - <<: *qwen_worker
    client_id: "u1"
  - <<: *qwen_worker
    client_id: "u2"